version: v2
managed:
  enabled: true
  disable:
    - module: buf.build/googleapis/googleapis
  override:
    - file_option: java_package_prefix
      value: de.uni_trier.recap
clean: true
inputs:
  - module: buf.build/recap/arg-services:v1.5.6
# oldest protobuf 4.x and grpc releases to avoid conflicts with other packages,
# keep in sync with the BOMs in build.gradle
plugins:
  - remote: buf.build/protocolbuffers/java:v34.0
    out: src/main/java
  - remote: buf.build/grpc/java:v1.82.0
    out: src/main/java
